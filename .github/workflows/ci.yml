name: Build and release

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      short_commit: ${{ steps.target.outputs.short_commit }}
      default_branch: ${{ steps.target.outputs.default_branch }}
      should_release: ${{ steps.target.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}

      - id: swift
        name: Identify Swift toolchain and workspace
        run: |
          swift_version=$(swift --version | sed -n '1p' | sed -E 's/[^A-Za-z0-9._-]+/-/g')
          echo "version=$swift_version" >> "$GITHUB_OUTPUT"
          workspace_hash=$(printf '%s' "$GITHUB_WORKSPACE" | shasum -a 256 | cut -d ' ' -f 1)
          echo "workspace=$workspace_hash" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-universal-${{ steps.swift.outputs.workspace }}-swift-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Support/Wallpaper.tbd', 'Tools/GenerateIcon.swift', 'assets/AppIcon.png') }}
          restore-keys: |
            ${{ runner.os }}-universal-${{ steps.swift.outputs.workspace }}-swift-${{ steps.swift.outputs.version }}-

      - id: target
        name: Resolve release target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          commit=$(git rev-parse HEAD)
          short_commit=$(printf '%s' "$commit" | cut -c 1-12)
          should_release=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; }; then
            should_release=true
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'short_commit=%s\n' "$short_commit" >> "$GITHUB_OUTPUT"
          printf 'default_branch=%s\n' "$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          printf 'should_release=%s\n' "$should_release" >> "$GITHUB_OUTPUT"

      - name: Test playback and update behavior
        run: swift test --parallel

      - name: Test compatibility verifier contract
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify update task can quit through AppKit
        run: python3 scripts/verify-update-termination.py "$(swift build --show-bin-path)/Motionpaper"

      - name: Build the menu bar app
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh scripts/build-app.sh release

      - name: Verify wallpaper linking and native assertion ownership
        run: python3 scripts/verify-wallpaper-loading.py dist/Motionpaper.app/Contents/MacOS/Motionpaper

      - name: Archive universal app for compatibility checks
        run: tar -czf dist/Motionpaper.app.tar.gz -C dist Motionpaper.app

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: motionpaper-compatibility-app-${{ steps.target.outputs.commit }}
          path: dist/Motionpaper.app.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Package release DMG
        if: steps.target.outputs.should_release == 'true'
        run: sh scripts/package-release.sh

      - uses: actions/upload-artifact@v7.0.2
        if: steps.target.outputs.should_release == 'true'
        with:
          name: motionpaper-release-${{ steps.target.outputs.commit }}
          path: dist/Motionpaper-${{ steps.target.outputs.short_commit }}.dmg
          if-no-files-found: error
          retention-days: 1

  compatibility:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            macos: '15'
            architecture: arm64
          - runner: macos-15-intel
            macos: '15'
            architecture: x86_64
          - runner: macos-26
            macos: '26'
            architecture: arm64
          - runner: macos-26-intel
            macos: '26'
            architecture: x86_64
          - runner: xcode-27
            macos: '27'
            architecture: arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
          sparse-checkout: scripts/verify-compatibility.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: motionpaper-compatibility-app-${{ needs.build.outputs.commit }}
          path: dist

      - name: Run native compatibility and assertion lifecycle verification
        timeout-minutes: 2
        run: |
          tar -xzf dist/Motionpaper.app.tar.gz -C dist
          python3 scripts/verify-compatibility.py dist/Motionpaper.app \
            --expected-commit '${{ needs.build.outputs.commit }}' \
            --expected-major '${{ matrix.macos }}' \
            --expected-architecture '${{ matrix.architecture }}' \
            --output 'dist/compatibility-${{ matrix.runner }}.json'

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: motionpaper-compatibility-${{ needs.build.outputs.commit }}-${{ matrix.runner }}
          path: dist/compatibility-${{ matrix.runner }}.json
          if-no-files-found: error
          retention-days: 90

  compatibility-coverage:
    needs: [build, compatibility]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            Support/CompatibilityTargets.json
            scripts/compatibility-coverage.py
          sparse-checkout-cone-mode: false

      - run: mkdir -p dist reports

      - uses: actions/download-artifact@v8.0.2
        with:
          name: motionpaper-compatibility-app-${{ needs.build.outputs.commit }}
          path: dist

      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          pattern: motionpaper-compatibility-${{ needs.build.outputs.commit }}-*
          path: reports
          merge-multiple: true

      - name: Hash the release binaries and summarize exact target evidence
        run: |
          tar -xzf dist/Motionpaper.app.tar.gz -C dist
          python3 scripts/compatibility-coverage.py \
            --targets Support/CompatibilityTargets.json \
            --reports-dir reports \
            --app dist/Motionpaper.app \
            --expected-commit '${{ needs.build.outputs.commit }}' \
            --output dist/compatibility-coverage.json

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: motionpaper-compatibility-coverage-${{ needs.build.outputs.commit }}
          path: dist/compatibility-coverage.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [build, compatibility, compatibility-coverage]
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: motionpaper-release-${{ needs.build.outputs.commit }}
          path: dist

      - name: Publish release and remove obsolete commit releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          DEFAULT_BRANCH: ${{ needs.build.outputs.default_branch }}
        run: bash scripts/publish-release.sh
